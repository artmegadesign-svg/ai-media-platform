services:
  app:
    image: python:3.12-slim
    working_dir: /code
    volumes:
      - .:/code
    env_file:
      - .env
    command: >
      sh -c "
      pip install uv &&
      uv sync &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "6379:6379"
