name: PR quality checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: amp_ci
          POSTGRES_PASSWORD: amp_ci_only
          POSTGRES_DB: amp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amp_ci -d amp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_POSTGRES_URL: postgresql+psycopg2://amp_ci:amp_ci_only@127.0.0.1:5432/amp_ci
      AI_GATEWAY_URL: http://gateway.example:9000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pydantic>=2.10" "pydantic-settings>=2.6" "httpx>=0.28" "pytest>=8.4" "ruff>=0.12.9"
      - name: Diff whitespace validation
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Ruff
        run: python -m ruff check .
      - name: SQLite unit and integration tests
        run: python -m pytest -q --ignore=tests/test_ci_postgres.py
      - name: Verify PostgreSQL migration graph
        run: |
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
      - name: Apply Alembic migrations to isolated PostgreSQL
        env:
          DATABASE_URL: ${{ env.CI_POSTGRES_URL }}
        run: python -m alembic upgrade head
      - name: Mandatory PostgreSQL integration checks
        env:
          AMP_REQUIRE_POSTGRES_TESTS: '1'
        run: python -m pytest -q -rs tests/test_ci_postgres.py
